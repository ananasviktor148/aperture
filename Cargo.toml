[package]
name = "aperture"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
futures-util = { version = "0.3.31", features = ["sink"] }
hex = "0.4.3"
local-ip-address = "0.6.13"
parking_lot = "0.13.0"
qrcode = "0.14.1"
rand = "0.10.3"
rayon = "1.12.0"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "=0.11.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Power"] }
windows-capture = "2.0.1"
