<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0c0a">
<title>Aperture — private desktop link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%230a0c0a'/%3E%3Ccircle cx='24' cy='24' r='16' fill='none' stroke='%23c8f751' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%23c8f751'/%3E%3C/svg%3E">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3.2 19.2 11l-6.1 1.5L10 19z"/></symbol>
  <symbol id="i-touchpad" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="15" r="1.6"/><path d="M8 9h8"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M6 9h.01M9 9h.01M12 9h.01M15 9h.01M18 9h.01M6 12.5h.01M9 12.5h.01M12 12.5h.01M15 12.5h.01M18 12.5h.01M7.5 16h9"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h10M7 14h6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.5 6.8a8 8 0 1 0 11 0"/></symbol>
  <symbol id="i-shift" viewBox="0 0 24 24"><path d="M12 3 3.5 12H8v8h8v-8h4.5z"/></symbol>
</svg>

<main id="app">

  <!-- ── GATE ─────────────────────────────────────────────── -->
  <section id="gate" class="gate" hidden>
    <div class="gate-inner">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21"/>
          <path d="M24 7.5 38.5 16.5 38.5 31.5 24 40.5 9.5 31.5 9.5 16.5Z"/>
          <path d="M24 7.5V24M38.5 16.5 24 24M38.5 31.5 24 24M24 40.5V24M9.5 31.5 24 24M9.5 16.5 24 24"/>
        </svg>
        <h1>APERTURE</h1>
        <p class="tag">PRIVATE DESKTOP LINK <span>/</span> LOW-LATENCY CONTROL</p>
      </div>

      <form id="gate-form" class="gate-card" autocomplete="off">
        <label for="token">ACCESS TOKEN</label>
        <input id="token" name="token" spellcheck="false" autocapitalize="off" autocomplete="off"
               placeholder="open the link printed by the agent">
        <button id="connect-btn" class="primary" type="submit">CONNECT</button>
        <p id="gate-msg" class="gate-msg">The link contains your token. You can also paste it here.</p>
      </form>

      <footer class="gate-foot">
        <span>H.264 · WEBCODECS</span>
        <span>ENCRYPTED TRANSPORT</span>
        <span>NO CLOUD</span>
      </footer>
    </div>
    <div class="gate-rule" aria-hidden="true"></div>
  </section>

  <!-- ── STAGE ────────────────────────────────────────────── -->
  <section id="stage" class="stage" hidden>
    <div id="screen" class="screen">
      <canvas id="video" width="16" height="9"></canvas>
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="boot" class="boot">
        <div class="scanner"><span></span></div>
        <p id="boot-msg">NEGOTIATING LINK</p>
      </div>
    </div>

    <header class="topbar">
      <div class="live-chip"><i class="pulse"></i><span>LIVE</span><b id="hud-res">—</b></div>
      <div class="metrics" id="metrics" aria-live="off">
        <div class="metric"><span>LAT</span><b id="m-lat">—</b><em>ms</em></div>
        <div class="metric"><span>RTT</span><b id="m-rtt">—</b><em>ms</em></div>
        <div class="metric"><span>FPS</span><b id="m-fps">—</b><em></em></div>
        <div class="metric"><span>RATE</span><b id="m-rate">—</b><em>Mb</em></div>
      </div>
    </header>

    <div class="src-line" id="src-line"></div>

    <div id="banner" class="banner" hidden><span id="banner-text"></span><button id="banner-retry">RETRY</button></div>

    <div class="mods" id="mods" aria-label="modifier keys" hidden>
      <button data-mod="ControlLeft">CTRL</button>
      <button data-mod="ShiftLeft">SHIFT</button>
      <button data-mod="AltLeft">ALT</button>
      <button data-mod="MetaLeft">WIN</button>
    </div>

    <div class="sheet keysheet" id="keysheet" hidden>
      <div class="sheet-head"><span>KEYS</span><button class="sheet-close" data-close>CLOSE</button></div>
      <div class="keygrid" id="keygrid"></div>
    </div>

    <aside class="sheet settings" id="settings" hidden>
      <div class="sheet-head"><span>CONTROL</span><button class="sheet-close" data-close>CLOSE</button></div>
      <div class="field">
        <div class="field-head"><label for="quality">VIDEO BITRATE</label><b id="quality-val">16 Mb/s</b></div>
        <input id="quality" type="range" min="2" max="60" step="1" value="16">
      </div>
      <div class="field">
        <div class="field-head"><label for="monitor">DISPLAY</label></div>
        <select id="monitor"></select>
      </div>
      <div class="field-row">
        <button id="kf-btn" class="ghost">FORCE KEYFRAME</button>
        <button id="hud-btn" class="ghost">TOGGLE HUD</button>
      </div>
      <button id="quit-btn" class="ghost danger">DISCONNECT</button>
      <p class="fineprint" id="fineprint"></p>
    </aside>

    <nav class="dock" id="dock">
      <div class="seg" id="mode-seg" role="group" aria-label="pointer mode">
        <button data-mode="direct" class="on"><svg><use href="#i-cursor"/></svg><span>DIRECT</span></button>
        <button data-mode="trackpad"><svg><use href="#i-touchpad"/></svg><span>TRACKPAD</span></button>
      </div>
      <div class="dock-sep"></div>
      <button id="btn-mods" class="icon" aria-label="modifier keys"><svg><use href="#i-shift"/></svg></button>
      <button id="btn-keyboard" class="icon" aria-label="type text"><svg><use href="#i-keyboard"/></svg></button>
      <button id="btn-keys" class="icon" aria-label="special keys"><svg><use href="#i-keys"/></svg></button>
      <button id="btn-settings" class="icon" aria-label="settings"><svg><use href="#i-sliders"/></svg></button>
      <button id="btn-fullscreen" class="icon" aria-label="fullscreen"><svg><use href="#i-expand"/></svg></button>
      <button id="btn-power" class="icon" aria-label="disconnect"><svg><use href="#i-power"/></svg></button>
    </nav>

    <input id="soft-input" class="soft-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" aria-label="remote keyboard">
  </section>
</main>

<!--APERTURE_ICE-->
<script src="/app.js"></script>
</body>
</html>
